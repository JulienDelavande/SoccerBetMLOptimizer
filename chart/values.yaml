# All application images are built by CI with the same tag (git sha or main-<timestamp>-<sha>).
image:
  registry: ghcr.io/juliendelavande
  tag: latest
  imagePullSecrets:
    name: cr-secret
    enabled: false

global:
  envRef: global-config

# External PostgreSQL (CloudNativePG cluster "optibet-db" in homelab-infra).
database:
  host: optibet-db-rw
  port: "5432"
  name: optimsportbets-db
  user: kube
  existingSecret: optibet-db-app
  passwordKey: password

services:
  dataIngestion:
    host: data-ingestion-svc
    image: optim-sportbet-data-ingestion
    port: "8100"
    replica: 1
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "512Mi"
    storage:
      size: 5Gi
      accessMode: ReadWriteOnce
    apiKeys:
      # Option 1 : L'utilisateur peut fournir un chemin de fichier contenant la clé API
      existingSecret: api-keys-secrets  # Insérer le nom du secret contenant la clé API
      secretKeys:
        theOddsApiKey: theOddsApiKey
      # Option 2 : L'utilisateur peut directement fournir la clé API dans `values.yaml`
      theOddsApiKey: ""  # Insérer directement la clé API ici si `existingApiKeySecret` est vide

  pipelines:
    host: pipelines-svc
    image: optim-sportbet-pipelines
    port: "8101"
    replica: 1

  appBackend:
    host: app-backend-svc
    image: optim-sportbet-app-backend
    port: "8103"
    replica: 1

  # Public site (static, nginx); proxies /api/ to app-backend-svc.
  appWeb:
    host: app-web-svc
    image: optim-sportbet-app-web
    port: "8104"
    replica: 1

  cdn:
    host: cdn-svc
    image: nginx
    tag: stable-alpine
    port: "80"
    replica: 1
    storage:
      size: 1Gi
      accessMode: ReadWriteOnce

ingress:
  enabled: true
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"

  frontendHost: optibet.delavande.fr
  # Backend and CDN are only reached in-cluster; keep them off the internet.
  exposeBackend: false
  backendHost: optibet.api.delavande.fr
  exposeCdn: false
  cdnHost: optibet.cdn.delavande.fr

# FlareSolverr endpoint used by the FBref reader (empty disables it).
flaresolverrUrl: http://flaresolverr.media.svc.cluster.local:8191

# Value bets against Pinnacle's fair line (research/backtest_sync.py). Runs after the odds ingestion.
valueBets:
  schedule: "5 12 * * *"
  request:
    books: []  # empty = every soft book we collect (exchanges excluded); the edge grows with the number compared
    min_edge: 0.02
    max_price: 3.5
    kelly_fraction: 0.5  # half Kelly: backtest x1.63, max drawdown 11% (quarter: x1.29, 5.7%)
    max_stake: 0.05
    max_total: 0.30
    blend_weight: 0.0  # 14-season validation: the model does not add information to Pinnacle
    optim_label: value_pinnacle

# Model-only optimizers (optimize-*.yaml). Off: the backtest shows model-only edges lose money
# against the market, and the Log/CRRA utilities are wrong (see PR description).
legacyOptimizers:
  enabled: false
