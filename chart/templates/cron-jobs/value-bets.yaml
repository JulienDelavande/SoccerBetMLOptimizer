apiVersion: batch/v1
kind: CronJob
metadata:
  name: value-bets-cronjob
  namespace: {{ .Release.Namespace }}
spec:
  # After the odds ingestion (11:50 UTC): bets on soft-book prices that beat Pinnacle's fair line.
  schedule: "{{ .Values.valueBets.schedule }}"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          containers:
          - name: value-bets
            image: curlimages/curl:7.85.0
            command: ["/bin/sh", "-c"]
            args:
              - |
                curl -fsS -X POST "${PIPELINES_PROTOCOL}://${PIPELINES_HOST}:${PIPELINES_PORT}/value_bets" \
                  -H "accept: application/json" -H "Content-Type: application/json" \
                  -d '{{ .Values.valueBets.request | toJson }}'
            envFrom:
              - configMapRef:
                  name: "{{ .Values.global.envRef | default "global-config" }}"
          restartPolicy: OnFailure
