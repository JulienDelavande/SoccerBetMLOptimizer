apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-backend
  namespace: {{ .Release.namespace }}
spec:
  replicas: {{ .Values.services.appBackend.replicas }}
  selector:
    matchLabels:
      app: app-backend
  template:
    metadata:
      labels:
        app: app-backend
    spec:
      containers:
      - name: app-backend
        image: "{{ .Values.image.registry }}/{{ .Values.services.appBackend.image }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: {{ .Values.services.appBackend.port }}
        env:
          {{ include "inject_db_password" . | nindent 10 }}  # Utilisation de indent pour corriger l'indentation dans l'environnement
          {{- include "inject_session_secret" . | nindent 10 }}
        envFrom:
        - configMapRef:
            name: global-config

      {{- if .Values.image.imagePullSecrets.enabled }}
      imagePullSecrets:
        - name: {{ .Values.image.imagePullSecrets.name }}
      {{- end }}
        
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.appBackend.host }}
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.services.appBackend.port }}
    targetPort: 80
  selector:
    app: app-backend
