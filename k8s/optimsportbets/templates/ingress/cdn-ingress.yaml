{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cdn-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  rules:
  - host: {{ .Values.ingress.cdnHost | quote }}
    http:
      paths:
      - path: /logos
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.services.cdn.host }}
            port:
              number: {{ .Values.services.cdn.port }}
  tls:
  - hosts:
    - {{ .Values.ingress.cdnHost | quote }}
    secretName: cdn-cert
{{- end }}
