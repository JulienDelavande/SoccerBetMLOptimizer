<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OptiBet · paris de valeur football</title>
  <meta name="description" content="Paris de valeur sur le football : les bookmakers en retard sur Pinnacle, chaque jour, avec l'historique complet." />
  <meta name="theme-color" content="#EDE4CF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#16271A" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23355E3B'/><circle cx='21.5' cy='10.5' r='4.5' fill='%23EF4429'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <script>
    document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") || localStorage.getItem("theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
</head>
<body>
  <a class="skip" href="#app">Aller au contenu</a>
  <header class="top">
    <div class="top-in">
      <a class="logo" href="#/" aria-label="OptiBet">
        <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><circle cx="21.5" cy="10.5" r="4.5"/></svg>
        <span class="logo-word">OptiBet</span>
      </a>
      <nav class="menu" aria-label="Navigation">
        <a href="#/" data-route="/">Aujourd'hui</a>
        <a href="#/performance" data-route="/performance">Performance</a>
        <a href="#/historique" data-route="/historique">Historique</a>
        <a href="#/methode" data-route="/methode">Méthode</a>
        <a href="#/compte" data-route="/compte">Compte</a>
      </nav>
      <div class="tools">
        <div class="stamp" id="stamp"><i class="live-dot" aria-hidden="true"></i><span id="stamp-t">CHARGEMENT…</span></div>
        <div class="viewsw" id="viewsw" role="group" hidden><button data-view="bot">Bot</button><button data-view="me">Moi</button></div>
        <button class="ibtn" id="lang" aria-label="Language">EN</button>
        <button class="ibtn" id="theme" aria-label="Thème"></button>
        <button class="cta" id="cta" hidden></button>
      </div>
    </div>
  </header>
  <div class="page">
  <main id="app" tabindex="-1"></main>
  <footer class="foot">
    <div class="foot-in">
      <a class="logo logo-foot" href="#/" aria-label="OptiBet">
        <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><circle cx="21.5" cy="10.5" r="4.5"/></svg>
        <span class="logo-word">OptiBet</span>
      </a>
      <p id="foot-legal"></p>
      <p id="foot-age"></p>
    </div>
  </footer>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
