server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;

  # The backend stays in-cluster; the site reaches it through this proxy.
  location /api/ {
    proxy_pass http://app-backend-svc:8103/;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
    add_header Cache-Control "public, max-age=60";
  }

  # Club, league and bookmaker logos from the existing in-cluster CDN.
  location /logos/ {
    proxy_pass http://cdn-svc:80/logos/;
    proxy_set_header Host cdn-svc;
    proxy_intercept_errors on;
    error_page 404 = @nologo;
    add_header Cache-Control "public, max-age=604800";
  }
  location @nologo {
    return 404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
