name: Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: juliendelavande

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync environment
        run: uv sync --package data-ingestion --python 3.10
      - name: optibet_lib and db tests
        run: uv run --package data-ingestion --with pytest --with scikit-learn --with trueskill pytest -q optibet_lib/tests db/tests
      - name: data-ingestion tests
        working-directory: data-ingestion
        run: uv run --package data-ingestion --with pytest pytest -q tests
      - name: app-backend tests
        working-directory: app-backend
        run: uv run --package app-backend --with pytest pytest -q

  build-images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One broken image must not cancel the others.
      fail-fast: false
      matrix:
        include:
          - image: optim-sportbet-app-backend
            context: .
            dockerfile: ./app-backend/Dockerfile
          - image: optim-sportbet-app-web
            context: ./app-web
            dockerfile: ./app-web/Dockerfile
          - image: optim-sportbet-data-ingestion
            context: .
            dockerfile: ./data-ingestion/Dockerfile
          - image: optim-sportbet-pipelines
            context: .
            dockerfile: ./pipelines/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  push-chart:
    runs-on: ubuntu-latest
    needs: build-images
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Login to GHCR OCI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Package and push chart
        run: |
          helm dependency update chart/ || true
          helm package chart/
          CHART_PKG=$(ls *.tgz)
          helm push "$CHART_PKG" oci://${{ env.REGISTRY }}/${{ env.OWNER }}/charts
