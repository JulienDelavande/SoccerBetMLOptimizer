name: optim-sportbet

x-osportbet-common:
  &osportbet-common
  env_file:
    - .env
    - .env.compose
    - .env.secrets
  networks:
    - optim-sportbet-network

services:
  data-ingestion:
    <<: *osportbet-common
    build:
      context: .
      dockerfile: ./data-ingestion/Dockerfile
    image: optim-sportbet-data-ingestion:${TAG}
    ports:
      - "${DATA_INGESTION_PORT:-8100}:80"

  pipelines:
    <<: *osportbet-common
    build:
      context: .
      dockerfile: ./pipelines/Dockerfile
    image: optim-sportbet-pipelines:${TAG}
    ports:
      - "${PIPELINES_PORT:-8101}:80"

  app-backend:
    <<: *osportbet-common
    build:
      context: .
      dockerfile: ./app-backend/Dockerfile
    image: optim-sportbet-app-backend:${TAG}
    ports:
      - "${APP_BACKEND_PORT_BRIDGE:-8102}:80"
    
  # app-frontend:
  #   <<: *osportbet-common
  #   build:
  #      context: ./app-frontend
  #      dockerfile: Dockerfile
  #   image: optim-sportbet-app-frontend:${TAG}
  #   ports:
  #     - "${APP_FRONTEND_PORT_BRIDGE:-8004}:${APP_FRONTEND_PORT:-80}"
    
  postgres:
    image: bitnami/postgresql:15
    container_name: dev-postgres
    environment:
      POSTGRESQL_USERNAME: ${DB_USER}
      POSTGRESQL_PASSWORD: ${DB_PASSWORD}
      POSTGRESQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT:-15432}:5432"
    networks:
      - optim-sportbet-network


networks:
  optim-sportbet-network:
    driver: bridge
